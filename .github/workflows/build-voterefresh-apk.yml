name: Build VoteRefresh APK
on:
  push:
    paths:
      - 'vote-refresh-android/**'
      - '.github/workflows/build-voterefresh-apk.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Gradle
        run: |
          curl -fsSLo /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-8.7/bin" >> "$GITHUB_PATH"
      - name: Build debug APK
        working-directory: vote-refresh-android
        run: gradle --no-daemon assembleDebug
      - name: Publish APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: voterefresh-v1.0.0
          name: VoteRefresh Android APK
          body: Install the attached VoteRefresh APK on your Android phone. This app counts manual votes only.
          files: vote-refresh-android/app/build/outputs/apk/debug/app-debug.apk
          make_latest: true
